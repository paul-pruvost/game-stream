[package]
name = "gamestream-client"
version = "0.1.0"
edition = "2021"
description = "GameStream client (Rust rewrite, in progress)"

[lib]
name = "gamestream_client"
path = "src/lib.rs"

[[bin]]
name = "gamestream-headless"
path = "src/bin/headless.rs"

[[bin]]
name = "gamestream-client"
path = "src/bin/client.rs"

[dependencies]
# H.264 decode, built from source (no FFmpeg / MSVC). Proven on the GNU toolchain.
openh264 = "0.6"
# TLS via the OS (SChannel on Windows) — no ring/aws-lc C build needed.
native-tls = "0.2"
# Pure-Rust AES-256-GCM (matches the host's cryptography.AESGCM).
aes-gcm = "0.10"
serde_json = "1"
# Windowing + GPU-accelerated presentation (wgpu under the hood).
# winit 0.28 + pixels 0.13 share raw-window-handle 0.5 (compatible pair).
winit = "0.28"
pixels = "0.13"

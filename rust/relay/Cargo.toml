[package]
name = "gamestream-relay"
version = "0.1.0"
edition = "2021"
description = "GameStream Internet Relay Server (TCP binary relay for host <-> client)"

[[bin]]
name = "gamestream-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
serde_json = "1"
socket2 = "0.5"

[profile.release]
lto = true
opt-level = 3
strip = true
